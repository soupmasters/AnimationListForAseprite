name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq lua5.4 unzip zip

      - name: Run tests
        run: ./scripts/test.sh

      - name: Build extension
        run: ./scripts/package.sh

      - name: Inspect extension archive
        run: |
          unzip -Z1 dist/AsepriteAnimationList.aseprite-extension
          unzip -t dist/AsepriteAnimationList.aseprite-extension

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: AsepriteAnimationList
          path: dist/AsepriteAnimationList.aseprite-extension
          if-no-files-found: error
