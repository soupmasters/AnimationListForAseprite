name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq lua5.4 unzip zip

      - name: Verify tag and manifest versions
        run: |
          manifest_version="$(jq -r '.version' package.json)"
          test "${GITHUB_REF_NAME}" = "v${manifest_version}"

      - name: Run tests
        run: ./scripts/test.sh

      - name: Build extension
        run: ./scripts/package.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/AsepriteAnimationList.aseprite-extension \
            --generate-notes \
            --title "Aseprite Animation List ${GITHUB_REF_NAME}" \
            --verify-tag
